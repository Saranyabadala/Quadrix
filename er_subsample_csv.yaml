# AUTO-DERIVED from er_subsample.yaml -- do not hand-edit.
# Differs ONLY in `sep` and the four input paths. Keep it that way, or a
# CSV run will not be comparable to the TSV baseline.
# Auto-generated by tools/build_er_subsample.py -- a dev config, not for scoring.
version: 1
sep: ","
chunk_size: 20000
max_training_pairs: 400000
max_tuning_pairs: 1000000
max_rollup_pairs: 20000000

paths:
  validate:
    source1: artifacts/er_sub/csv/source1.csv
    source2: artifacts/er_sub/csv/source2.csv
    source3: artifacts/er_sub/csv/source3.csv
    ground_truth: artifacts/er_sub/csv/ground_truth.csv
  predict:
    source1: artifacts/er_sub/csv/source1.csv
    source2: artifacts/er_sub/csv/source2.csv
    source3: artifacts/er_sub/csv/source3.csv

sources:
  source1:
    id_col: entity_id
    fields: {name: business_name, address: business_address, country: country}
  source2:
    id_col: entity_id
    fields: {name: business_name, address: business_address, country: country}
  source3:
    id_col: entity_id
    fields: {name: business_name, address: business_address, country: country}

blocking:
  max_candidates_per_record: 100
  per_rule_cap: 40
  large_candidate_multiplier: 2.0
  name_prefix_len: 8
  phonetic_scheme: nysiis
  min_token_len: 3
  max_bucket_size: 400
  # Keep the df cutoff at or below the bucket cap (see config/er.yaml).
  max_token_df_ratio: 0.01
  max_token_df_absolute: 400
  scope_token_index_by_country: true
  enable_country_prefix: true
  enable_country_city_prefix: true
  enable_shared_token: true
  enable_phonetic_country: true
  enable_exact_entity_id: false
  enable_fallback: true
  fallback_fuzzy_floor: 0.72
  fallback_window: 15
  fallback_neighborhood_window: 3
  fallback_max_candidates: 50
  enable_debug_log: true
  max_debug_rows: 200000

weights:
  name: 0.45
  address: 0.30
  city_state: 0.15
  country: 0.10

decision:
  high_threshold: 0.85
  low_threshold_ratio: 0.60
  low_threshold: null
  ambiguity_margin: 0.05
  block_on_country_conflict: true
  block_on_location_conflict: true
  location_conflict_floor: 0.80

validation:
  val_fraction: 0.20
  tune_fraction: 0.50

# Hard negatives: bias the negative half of the training matrix toward pairs the
# scorer already rates most similar, instead of sampling uniformly. Training
# only -- the tune cache and the held-out report split are untouched, so the
# reported score stays comparable to the hardneg-disabled baseline.
hardneg:
  # Measured regression: hardneg arm = 0.8933 vs baseline 0.9019.
  # Kept off until the bimodality diagnosis is acted on.
  enabled: false
  hard_fraction: 0.70      # share of the negative budget from the hard band
  locality_fraction: 0.50   # of that, share also agreeing on country+city
  random_fraction: 0.30     # kept uniform so calibration is not skewed
  max_per_entity: 40
  min_locality_score: 0.5

model:
  prefer: lightgbm
  n_estimators: 400
  learning_rate: 0.06
  max_leaf_nodes: 31
  min_samples_leaf: 20
  n_jobs: 8
